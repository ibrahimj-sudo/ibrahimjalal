[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = ["admin"]}

# SPA fallback — serve index.html for client-side routes
# but NOT for /api/* (handled by functions above)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
